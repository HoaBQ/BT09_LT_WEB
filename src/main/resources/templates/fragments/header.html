<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">UTEShop</a>
    </div>

    <nav>
        <div class="account" th:if="${#authorization.expression('isAuthenticated()')}" style="display: flex; gap: 15px; align-items: center;">
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 class="thumb" style="width: 36px; height: 36px; border-radius: 50%;" alt="Avatar">

            <span th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>

            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="link-button">Đăng xuất</button>
            </form>
        </div>

        <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}" class="btn primary">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
